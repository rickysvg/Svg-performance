# Vercel Hobby rejects cron expressions that run more than once a day, so the
# hourly check-in reminder calls production from here.
# Ricky: add the Vercel CRON_SECRET value as a repository Actions secret named
# CRON_SECRET (Settings → Secrets and variables → Actions). Until that secret
# exists, this job skips and the daily Vercel cron still sends reminders.
name: Check-in reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the check-in reminder route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::Add CRON_SECRET as a GitHub Actions secret (the same value as Vercel). Until then the daily Vercel cron sends check-in reminders."
            exit 0
          fi
          code="$(curl -sS -o /tmp/checkin-cron.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://svg-performance.vercel.app/api/cron/checkins")"
          cat /tmp/checkin-cron.json
          echo
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "Check-in cron returned HTTP ${code}"
            exit 1
          fi
