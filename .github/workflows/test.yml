name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      # Dummy SQLite URL. tests/setup.ts points Prisma at prisma/test.db,
      # migrates, and seeds before the suite. No service database.
      DATABASE_URL: file:./test.db
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      # Coach tests assert the offline reply. A key would call the model.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
