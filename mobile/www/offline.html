    <p>SVG Performance needs a connection to load. Sets you already entered in an open workout stay on this phone as a draft. Reconnect to save them.</p>
    <button id="retry" type="button">Try again</button>

  <script>
    (function () {
      var HOME = "https://svgperformance.app/home";
      var status = document.getElementById("status");
      function go() {
        if (navigator.onLine === false) {
          status.textContent = "Still no connection. We'll reload as soon as you're back.";
          return;
        }
        status.textContent = "Reconnecting…";
        window.location.replace(HOME);
      }
      document.getElementById("retry").addEventListener("click", go);
      window.addEventListener("online", go);
    })();
